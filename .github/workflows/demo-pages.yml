name: Demo checks

# The fork does not publish the upstream GitHub Pages demo. Keep its build
# check for pull requests that change demo/.

on:
  pull_request:
    paths:
      - "demo/**"
      - ".github/workflows/demo-pages.yml"

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
